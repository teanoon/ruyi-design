<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>如意设计 · Ruyi Design</title>
    <link rel="icon" type="image/svg+xml" href="/ruyi-mark.svg" />
  </head>
  <body>
    <a class="skip" href="#canvas">跳到预览</a>
    <div id="app">
      <header>
        <div class="brand">
          <img class="brand-logo" src="/ruyi-wordmark.svg" alt="如意设计 · Ruyi Design" width="176" height="44" />
          <img class="brand-symbol" src="/ruyi-mark.svg" alt="如意设计" width="40" height="40" />
          <span class="divider"></span><span id="project">设计评审工作区</span>
        </div>
        <div class="header-right">
          <span id="activity" role="status">连接中</span
          ><span id="revision" class="badge"></span>
        </div>
      </header>
      <div class="layout">
        <aside class="navigation">
          <div class="section-label">设计工作区</div>
          <button id="preview-toggle" class="secondary preview-toggle" aria-pressed="false">预览</button>
          <nav id="navigation" aria-label="设计导航"></nav>
          <div class="nav-footer">
            <strong>小爱好出品</strong><small>BY LITTLEHOBBY</small><br /><span>让设计，更合心意。</span>
          </div>
        </aside>
        <main>
          <div class="toolbar">
            <div>
              <div class="section-label" id="eyebrow">页面设计</div>
              <h1 id="title">选择设计稿</h1>
            </div>
            <div class="controls">
              <label id="state-control">状态
                <select id="state" aria-label="状态"></select></label>
              <label>设备
                <select id="device" aria-label="设备"></select></label>
            </div>
          </div>
          <div id="history-banner" class="history-banner" hidden>
            <span id="history-version"></span>
            <button id="return-latest" class="secondary">返回最新版本</button>
          </div>
          <div id="notice" role="status"></div>
          <div id="canvas" tabindex="-1"></div>
        </main>
        <aside class="feedback">
          <div class="feedback-heading">
            <h2>评审反馈</h2>
            <span id="count" class="badge">0</span>
          </div>
          <p class="hint" id="interaction-hint">点击元素添加评论，保存后在对话中告诉 AI 可以更新。</p>
          <form id="composer" hidden>
            <label for="comment-text">评论内容</label>
            <div id="target-label" class="hint"></div>
            <textarea
              id="comment-text"
              rows="4"
              required
              placeholder="描述你希望如何改进…"
            ></textarea>
            <div class="row">
              <button type="button" id="cancel-comment" class="secondary">
                取消</button
              ><button type="submit" class="primary">保存评论</button>
            </div>
          </form>
          <div id="comments"></div>
          <div class="review-next-step">
            <div id="pending-count" class="hint"></div>
            <p class="hint">评论保存后，请在 AI 对话中说：<br />“我已评论，可以更新。”</p>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
