<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>如意设计 · Ruyi Design</title>
    <link rel="icon" type="image/svg+xml" href="/ruyi-mark.svg?v=transparent-tight" />
  </head>
  <body>
    <a class="skip" href="#canvas">跳到预览</a>
    <div id="app">
      <div class="layout">
        <aside class="navigation" aria-label="设计工作区">
          <button id="preview-toggle" disabled class="secondary preview-toggle" aria-pressed="false" aria-keyshortcuts="C" aria-describedby="shortcut-help revision-description">
            <span id="preview-label">预览</span><span id="revision" class="preview-version" aria-hidden="true"></span><kbd id="preview-key" aria-hidden="true">C</kbd>
          </button>
          <span id="revision-description" class="sr-only"></span>
          <nav id="navigation" aria-label="设计导航"></nav>
          <div class="sidebar-footer">
            <div class="workspace-brand" aria-label="如意设计 · Ruyi Design">
              <img src="/ruyi-mark.svg" alt="如意设计" width="36" height="36" />
              <strong>如意设计</strong><span id="activity" class="connection-status" role="status" data-state="pending"><span class="connection-state-label">连接中</span></span>
            </div>
          </div>
        </aside>
        <main id="main" tabindex="-1">
          <div class="toolbar">
            <div>
              <div class="section-label" id="eyebrow">页面设计</div>
              <h1 id="title">选择设计稿</h1>
            </div>
            <div class="controls">
              <label id="state-control"><span>状态 <kbd aria-hidden="true">↑ ↓</kbd></span>
                <select id="state" aria-label="状态" aria-keyshortcuts="ArrowUp ArrowDown" aria-describedby="shortcut-help"></select></label>
              <label><span>设备 <kbd id="device-key" aria-hidden="true">← →</kbd></span>
                <select id="device" aria-label="设备" aria-keyshortcuts="ArrowLeft ArrowRight" aria-describedby="shortcut-help"></select></label>
            </div>
          </div>
          <p id="shortcut-help" class="sr-only">非输入时：C 切换预览，左右方向键切换设备，上下方向键切换页面状态。到首尾不循环。预览画布中的方向键留给页面；组件只切换设备，令牌不切换组合。</p>
          <div id="history-banner" class="history-banner" hidden>
            <span id="history-version"></span><button id="return-latest" class="secondary">返回最新版本</button>
          </div>
          <div id="notice" role="status"></div>
          <div class="canvas-top"><span id="canvas-mode-text">元素评论 · 点击即可留下想法</span><span>适应画布</span></div>
          <div id="canvas" tabindex="-1"></div>
        </main>
        <aside class="feedback">
          <div class="feedback-heading"><h2>评审反馈</h2><span id="count" class="badge">0</span></div>
          <p class="hint" id="interaction-hint">选择画布中的元素，已有评论将在原位展开编辑。</p>
          <div class="comment-tabs" role="group" aria-label="评论分组">
            <button id="active-tab" aria-pressed="true" aria-controls="active-comments">进行中 0</button>
            <button id="archive-tab" aria-pressed="false" aria-controls="archived-comments">已归档（0）</button>
          </div>
          <form id="composer" hidden>
            <label for="comment-text">评论内容</label><div id="target-label" class="hint"></div>
            <textarea id="comment-text" rows="4" required placeholder="描述你希望如何改进…"></textarea>
            <div class="row"><span class="save-shortcut">Ctrl / ⌘ + Enter 保存</span><button type="button" id="cancel-comment" class="secondary">取消</button><button type="submit" class="primary">保存评论</button></div>
          </form>
          <div id="comments"></div><span id="pending-count" class="sr-only" role="status"></span>
        </aside>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
